[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "specterm1d"
# Derived from the git tag by setuptools_scm, so a release is a tag and
# nothing else can drift out of step with it.
dynamic = ["version"]
description = "Terminal-based 1D spectrum viewer with IRAF splot keybindings"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["spectroscopy", "astronomy", "terminal", "splot", "fits"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
authors = [{name = "T. E. Pickering", email = "te.pickering@gmail.com"}]
dependencies = [
    # fitting.py uses np.trapezoid; np.trapz is gone in numpy 2.x
    "numpy>=2.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=6.0",
    "specutils>=2.0",
]

[project.optional-dependencies]
pypeit = ["pypeit>=1.14"]
sixel = ["libsixel-python>=0.5"]
docs = ["sphinx>=9.1", "myst-parser>=5.1", "furo>=2025.12.19"]
dev = ["pytest>=7.4", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/tepickering/specterm1d"
Documentation = "https://specterm1d.readthedocs.io"
Repository = "https://github.com/tepickering/specterm1d"
Issues = "https://github.com/tepickering/specterm1d/issues"

[project.scripts]
specterm1d = "specterm1d.cli:main"
st1d = "specterm1d.cli:main"

[tool.setuptools.packages.find]
include = ["specterm1d*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["devsuite: requires PypeIt-development-suite data on disk"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF"]
ignore = [
    # "%d" formatting in text.py's per-cell hot loop is deliberate: it
    # formats a tuple in one operation where an f-string needs three lookups.
    "UP031",
]
# Do not add BLE001 or S110. Teardown swallows exceptions on purpose - the
# terminal must never be left in raw mode, with a hidden cursor, or reporting
# mouse events, and an exception on the way out would do exactly that.

[tool.ruff.lint.per-file-ignores]
# Importing these packages is what populates the loader, renderer and command
# registries; the imports are the point, not accidental.
"specterm1d/io/__init__.py" = ["F401"]
"specterm1d/term/__init__.py" = ["F401"]
"specterm1d/commands/__init__.py" = ["F401"]
