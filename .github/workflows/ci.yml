name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      # matplotlib must never reach for a display in CI.
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codestyle
            python: "3.14"
            extras: dev
            command: ruff check .
          - name: build_docs
            python: "3.14"
            extras: docs
            command: sphinx-build -W --keep-going docs docs/_build/html
          - name: test (3.14)
            python: "3.14"
            extras: dev
            command: python -m pytest -q
          - name: test (3.13)
            python: "3.13"
            extras: dev
            command: python -m pytest -q
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm derives the version from the tag history, and a
          # shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[${{ matrix.extras }}]'
      - run: ${{ matrix.command }}

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install build twine
      # Catches a broken long description or bad metadata on the pull request
      # that introduces it. On release day the version number is already spent.
      - run: python -m build
      - run: twine check --strict dist/*
