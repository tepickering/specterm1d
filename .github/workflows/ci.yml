name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Free-threaded rows are there to find out, not to gate a merge.
    continue-on-error: ${{ matrix.experimental || false }}
    env:
      # matplotlib must never reach for a display in CI.
      MPLBACKEND: Agg
      # On a free-threaded build, importing an extension that has not declared
      # itself thread-safe quietly turns the GIL back on, and the tests would
      # then pass without testing anything. Keep it off so they fail instead.
      # Empty on the other rows, where CPython ignores it; 0 there is fatal.
      PYTHON_GIL: ${{ matrix.gil }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codestyle
            python: "3.14"
            extras: dev
            command: ruff check .
          - name: build_docs
            python: "3.14"
            extras: docs
            command: sphinx-build -W --keep-going docs docs/_build/html
          - name: test (3.14)
            python: "3.14"
            extras: dev
            command: python -m pytest -q
          - name: test (3.13)
            python: "3.13"
            # One row carries PypeIt so its reader tests run rather than skip.
            # It has to be this one: every PypeIt release so far declares
            # Requires-Python <3.14, which pip honours (uv does not, so a
            # local uv install on 3.14 is no guide). Free-threaded builds are
            # out regardless: fast-histogram, a PypeIt dependency, builds
            # against the limited API, which those builds lack.
            extras: dev,pypeit
            command: python -m pytest -q
          - name: test (3.14t)
            python: "3.14t"
            extras: dev
            command: python -m pytest -q
            gil: "0"
            experimental: true
          - name: test (3.15t)
            python: "3.15t"
            extras: dev
            command: python -m pytest -q
            gil: "0"
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm derives the version from the tag history, and a
          # shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          # 3.15 is still a release candidate.
          allow-prereleases: true
          cache: pip
      - run: pip install -e '.[${{ matrix.extras }}]'
      - run: ${{ matrix.command }}

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install build twine
      # Catches a broken long description or bad metadata on the pull request
      # that introduces it. On release day the version number is already spent.
      - run: python -m build
      - run: twine check --strict dist/*
