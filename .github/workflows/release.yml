name: Release

# Pushing a vX.Y.Z tag is the whole release ritual: this workflow builds the
# artefact, cuts the GitHub Release from it, and uploads to PyPI.
#
# Publishing to PyPI is irreversible - a version number, once used, can never
# be reused even after the file is deleted. So the artefact is built and
# checked once, then both the Release and the upload draw on that same
# artefact, and TestPyPI can be rehearsed by hand before anything reaches the
# real index.
#
# There is deliberately no `release: [published]` trigger. Creating a release
# through the web UI on a new tag fires both that and the tag push, which
# would build and upload the same version twice; the second upload fails with
# a file-already-exists error that says nothing useful.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm needs the tag to produce a release version rather
          # than a development guess.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Refuse to publish a development version
        # A tagless build produces something like 0.1.dev48+gae58a27, whose
        # local-version segment PyPI rejects outright. Failing here says why,
        # rather than leaving it to a confusing upload error.
        run: |
          version=$(ls dist/*.tar.gz | sed -E 's/.*specterm1d-(.*)\.tar\.gz/\1/')
          echo "built version: $version"
          case "$version" in
            *dev*|*+*) echo "::error::$version is not a release version; tag the commit first"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github_release:
    needs: build
    # Only the tag push cuts a Release; a manual run is for rehearsing an
    # upload against TestPyPI, and should not touch the repository.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Creating the Release is a write to the repository itself.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Is this a prerelease?
        id: kind
        # Anything beyond a bare vX.Y.Z - v0.1.0rc1, an alpha or a beta - is
        # a prerelease, so it stays out of the "Latest release" slot and out
        # of Read the Docs' `stable`, which tracks the highest full release.
        run: |
          # The pattern lives in a variable because an inline one is subject
          # to the shell's own quote removal before the match sees it.
          release='^v[0-9]+(\.[0-9]+)*$'
          if [[ "$GITHUB_REF_NAME" =~ $release ]]; then
            pre=false
          else
            pre=true
          fi
          echo "$GITHUB_REF_NAME prerelease=$pre"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.kind.outputs.prerelease }}
          # Release notes come from the merged pull requests since the last
          # tag, which is what the commit history here already reads as.
          generate_release_notes: true
          files: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so
    # there is no API token to store or leak. The `pypi` environment carries
    # the required-reviewer rule, so a tag push queues the upload rather than
    # firing it - the GitHub Release lands either way.
    environment: ${{ github.event.inputs.target || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
